hostname r3
password zebra
!
interface eth1
 description to_r1
 ip address 10.13.1.1/31
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
!
interface eth2
 description to_r4
 ip address 10.34.1.0/31
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
!
interface lo
 ip address 3.3.3.3/32
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 3.3.3.3
 passive-interface lo
!
line vty
!
