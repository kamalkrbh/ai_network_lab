name: ospf-ecmp-sonic-only

topology:
  nodes:
    r1:
      kind: sonic-vs
      image: docker-sonic-vs:latest
      binds:
        - configs/r1/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
    r2:
      kind: sonic-vs
      image: docker-sonic-vs:latest
      binds:
        - configs/r2/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
    r3:
      kind: sonic-vs
      image: docker-sonic-vs:latest
      binds:
        - configs/r3/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
    r4:
      kind: sonic-vs
      image: docker-sonic-vs:latest
      binds:
        - configs/r4/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
    host1:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 192.168.1.2/24 dev eth1
        - ip route add 192.168.2.0/24 via 192.168.1.1
    host2:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 192.168.2.2/24 dev eth1
        - ip route add 192.168.1.0/24 via 192.168.2.1

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r1:eth2", "r3:eth1"]
    - endpoints: ["r1:eth3", "host1:eth1"]
    - endpoints: ["r2:eth2", "r4:eth1"]
    - endpoints: ["r3:eth2", "r4:eth2"]
    - endpoints: ["r4:eth3", "host2:eth1"]
